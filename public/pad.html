<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1c1613">
<title>Controller · Open Mortal Arcade</title>
<link rel="icon" href="img/favicon.png">
<link rel="stylesheet" href="css/theme.css">
<style>
  html, body { height: 100%; overscroll-behavior: none; }
  body { overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .join { max-width: 420px; margin: 0 auto; padding: 28px 16px; display: grid; gap: 14px; text-align: center; }
  .join .wordmark { font-size: 54px; }
  .join input { text-align: center; font-size: 26px; letter-spacing: .2em; text-transform: uppercase; }
  .join input#name { letter-spacing: 0; text-transform: none; font-size: 20px; }
  .err { color: var(--blood-hi); min-height: 1.4em; font-weight: 600; }

  .pad { height: 100%; display: grid; grid-template-rows: auto 1fr; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: rgba(18,13,11,.92); box-shadow: inset 0 -3px 0 var(--brass-lo); }
  .bar .me { font: 700 18px var(--font-ui); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .slotchip { font: 700 16px var(--font-ui); padding: 4px 10px; background: var(--stone-3); color: var(--bone); }
  .bar .slotchip.p1 { background: var(--p1); color: var(--stone-0); } .bar .slotchip.p2 { background: var(--p2); color: var(--stone-0); }
  .bar .slab { padding: 7px 12px; font-size: 15px; }
  .msg { position: absolute; left: 50%; top: 64px; transform: translateX(-50%); background: var(--stone-0); padding: 8px 14px; box-shadow: inset 0 0 0 2px var(--brass); font-weight: 600; z-index: 3; max-width: 90vw; text-align: center; }

  .deck { position: relative; display: grid; grid-template-columns: 1fr 1fr; align-items: center; justify-items: center; padding: 10px 18px 18px; gap: 12px; }
  .dpad { position: relative; width: min(46vw, 62vh, 300px); aspect-ratio: 1; }
  .dpad .arm { position: absolute; background: var(--stone-3); box-shadow: var(--bevel-out), var(--step-shadow); }
  .dpad .h { left: 0; right: 0; top: 33%; height: 34%; }
  .dpad .v { top: 0; bottom: 0; left: 33%; width: 34%; }
  .dpad .hub { position: absolute; left: 33%; top: 33%; width: 34%; height: 34%; background: var(--stone-3); }
  .dpad .arrow { position: absolute; width: 0; height: 0; border: 11px solid transparent; }
  .dpad .a-up { left: calc(50% - 11px); top: 7%; border-bottom-color: var(--bone-dim); }
  .dpad .a-down { left: calc(50% - 11px); bottom: 7%; border-top-color: var(--bone-dim); }
  .dpad .a-left { top: calc(50% - 11px); left: 7%; border-right-color: var(--bone-dim); }
  .dpad .a-right { top: calc(50% - 11px); right: 7%; border-left-color: var(--bone-dim); }
  .dpad.on-up .a-up { border-bottom-color: var(--ember); } .dpad.on-down .a-down { border-top-color: var(--ember); }
  .dpad.on-left .a-left { border-right-color: var(--ember); } .dpad.on-right .a-right { border-left-color: var(--ember); }

  .face { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); width: min(46vw, 62vh, 300px); aspect-ratio: 1; gap: 4px; }
  .btn { display: grid; place-content: center; text-align: center; border-radius: 50%; font: 700 13px/1.1 var(--font-ui); color: var(--bone);
    background: radial-gradient(circle at 35% 30%, var(--stone-4) 0 18%, var(--stone-3) 19% 62%, var(--stone-2) 63%); box-shadow: 0 4px 0 var(--stone-0); }
  .btn b { font-size: 22px; display: block; }
  .btn.punch { background: radial-gradient(circle at 35% 30%, #e05a3f 0 18%, var(--blood) 19% 62%, var(--blood-deep) 63%); }
  .btn.kick { background: radial-gradient(circle at 35% 30%, var(--brass-hi) 0 18%, var(--brass) 19% 62%, var(--brass-lo) 63%); color: var(--stone-0); }
  .btn.down { transform: translateY(3px); box-shadow: 0 1px 0 var(--stone-0); filter: brightness(1.25); }
  .b-hp { grid-area: 1 / 2; } .b-lp { grid-area: 2 / 1; } .b-hk { grid-area: 2 / 3; } .b-lk { grid-area: 3 / 2; }
  .b-block { grid-area: 2 / 2; border-radius: 0; font-size: 13px; background: var(--stone-3); box-shadow: var(--bevel-out), 0 3px 0 var(--stone-0); }
  .legend { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--bone-faint); pointer-events: none; }
  @media (orientation: portrait) {
    .deck { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .dpad, .face { width: min(76vw, 38vh, 300px); }
  }
</style>
</head>
<body>
<section class="join" id="joinView">
  <img src="img/emblem-160.png" alt="" width="80" height="80" style="margin:0 auto">
  <h1 class="wordmark"><span>Join a fight</span></h1>
  <label class="field">Room code on the big screen<input type="text" id="code" maxlength="4" autocomplete="off" autocapitalize="characters" inputmode="text" placeholder="ABCD"></label>
  <label class="field">Your fighter name<input type="text" id="name" maxlength="14" autocomplete="nickname" placeholder="Player"></label>
  <button class="slab blood" id="joinBtn">Join</button>
  <div class="err" id="err" role="alert"></div>
  <p class="dim small">Keyboard on a laptop works too: arrows to move, J U K I to punch and kick, L to block. Gamepads work on https or localhost.</p>
</section>

<section class="pad" id="padView" hidden>
  <div class="bar">
    <span class="slotchip" id="slot">...</span>
    <span class="me" id="me"></span>
    <button class="slab" id="bBack" data-btn="back">Menu</button>
    <button class="slab brass" id="bStart" data-btn="start">Start</button>
  </div>
  <div class="deck" id="deck">
    <div class="dpad" id="dpad" aria-label="Direction pad">
      <div class="arm h"></div><div class="arm v"></div><div class="hub"></div>
      <i class="arrow a-up"></i><i class="arrow a-down"></i><i class="arrow a-left"></i><i class="arrow a-right"></i>
    </div>
    <div class="face" id="face">
      <div class="btn punch b-hp" data-btn="hp"><span><b>HP</b>high punch</span></div>
      <div class="btn punch b-lp" data-btn="lp"><span><b>LP</b>low punch</span></div>
      <div class="btn b-block" data-btn="block">BLOCK</div>
      <div class="btn kick b-hk" data-btn="hk"><span><b>HK</b>high kick</span></div>
      <div class="btn kick b-lk" data-btn="lk"><span><b>LK</b>low kick</span></div>
    </div>
    <div class="legend">Slide your thumb across buttons. Specials are on each fighter's stats screen.</div>
  </div>
  <div class="msg" id="msg" hidden></div>
</section>
<script type="module" src="js/pad.js"></script>
</body>
</html>
